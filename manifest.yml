modules:
  jira:issuePanel:
    - key: flowlens-issue-panel
      resource: app
      resolver:
        function: resolver
      title: FlowLens
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: app
    path: static/app/dist
    tunnel:
      port: 5173
permissions:
  scopes:
    - read:jira-work
    - storage:app
app:
  id: ari:cloud:ecosystem::app/7784456b-a4d3-421a-b066-521e01766e3e
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  storage:
    entities:
      - name: investigation-record
        attributes:
          revision:
            type: string
          data:
            type: any
